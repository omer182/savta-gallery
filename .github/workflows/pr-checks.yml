name: PR Checks

on:
  pull_request:
    branches: [main, master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        # lib/session.ts refuses to run without a secret; page-data collection
        # evaluates it. Nothing is signed with this.
        env:
          SESSION_SECRET: ci-placeholder-not-used-for-anything
        run: npm run build

      - name: Migrations apply to a clean database
        env:
          DATA_DIR: ./ci-data
        run: npm run db:migrate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test image builds
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
