# Reference only — the live vhost is maintained by hand on the server.
# Domain, TLS and Cloudflare are all owned outside this repo (PLAN.md §7).

server {
    listen 80;
    server_name bluma.omersher.com;

    # Uploads are resized client-side to a couple of MB, but the app's own
    # ceiling is 50MB and nginx defaults to 1MB — without this every upload
    # dies with a 413 and no useful message.
    client_max_body_size 50m;

    # Derivatives straight off disk, never through Node. Filenames are
    # content-hashed, so the bytes behind a URL never change and this can be
    # cached forever, at the edge as well as in the browser.
    location /images/derived/ {
        alias /srv/savta-gallery/data/images/derived/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Originals are NOT served here on purpose. They are the uncropped frames —
    # for imported paintings they still show the wall and the numbered sticky
    # note — and the app gates them behind an admin session. Letting nginx serve
    # them from disk would bypass that check entirely.

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # Nothing behind the login may be cached by any intermediary.
    location ~ ^/(admin|api|login) {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, private" always;
    }
}
